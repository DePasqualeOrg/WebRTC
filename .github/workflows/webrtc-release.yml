name: WebRTC Release
run-name: WebRTC Release
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  Build-Script:
    # macos-latest (macOS 15) has Xcode 16.4, whose SDK lacks modulemap
    # files required by recent Chromium buildtools. Use macos-26 until
    # macos-latest is updated.
    runs-on: macos-26
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Running WebRTC release checks
        run: |
          sh clean.sh
          pip install requests python-telegram-bot
          python -u scripts/release.py
    
